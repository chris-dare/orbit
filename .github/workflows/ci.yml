name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded pushes to a PR are worth cancelling. A push to main is not:
  # Vercel is already deploying that commit to production, so its checks need
  # to finish even if another merge lands behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next.js 16 removed `next lint` and `next build` no longer runs ESLint,
      # so this job is the only thing linting this repo. Vercel's build will
      # not catch it.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
